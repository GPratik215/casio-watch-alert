name: Check Casio watch stock

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly during
    # high load - that's normal for the free tier.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

concurrency:
  group: casio-stock-check
  cancel-in-progress: false   # let a running check finish rather than killing it mid-push

permissions:
  contents: write   # needed so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run stock check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_stock.py

      - name: Save state
        run: |
          git config user.name "stock-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Update stock-check state"
          git pull --rebase origin main
          git push
